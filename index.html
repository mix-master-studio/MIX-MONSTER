<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミックスモンスター</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef; padding: 15px; margin: 0; }
        .box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 15px; }
        button { font-size: 15px; padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; width: 85%; max-width: 300px; font-weight: bold; }
        button:active { background: #0056b3; }
        .attack-btn { background: #dc3545; }
        .attack-btn:active { background: #bd2130; }
        .catch-btn { background: #ffc107; color: #212529; }
        .catch-btn:disabled { background: #e2e3e5; color: #6c757d; cursor: not-allowed; }
        .haigo-btn { background: #28a745; }
        .haigo-btn:active { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; margin: 8px 0; padding: 12px; border-radius: 5px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .select-checkbox { transform: scale(1.5); margin-right: 15px; }
        .monster-avatar { font-size: 70px; margin: 10px auto; display: block; line-height: 1; }
        .list-avatar { font-size: 30px; margin-left: auto; }
        .flex-container { display: flex; align-items: center; width: 100%; }
        .hp-bar-bg { background: #eee; border-radius: 5px; height: 12px; width: 80%; margin: 5px auto; overflow: hidden; border: 1px solid #ccc; }
        .hp-bar { background: #28a745; height: 100%; width: 100%; transition: width 0.2s; }
        .zukan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        .zukan-item { background: #f8f9fa; border: 1px solid #eee; border-radius: 5px; padding: 5px; font-size: 11px; }
        .zukan-unknown { filter: brightness(0); opacity: 0.3; }
    </style>
</head>
<body>

    <h1>👾 ミックスモンスター (超進化・配合確率版)</h1>

    <!-- 敵出現・バトルエリア -->
    <div class="box">
        <h3>目の前に あらわれた！</h3>
        <h2 id="enemy-name">スライム</h2>
        <div id="enemy-avatar" class="monster-avatar">💧</div>
        <div id="enemy-hp-text" style="font-weight: bold; font-size: 14px;">HP: 10 / 10</div>
        <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar"></div></div>
        
        <button class="attack-btn" onclick="attackEnemy()">⚔️ こうげきしてHPをへらす！</button>
        <button id="catch-button" class="catch-btn" onclick="catchMonster()" disabled>💥 弱らせて仲間にする！</button>
    </div>

    <!-- 配合エリア -->
    <div class="box">
        <h3>🧬 モンスター配合 (成功率50%)</h3>
        <p style="font-size: 13px; color: #666;">仲間を2匹チェックして勝負に出よう！</p>
        <button class="haigo-btn" onclick="combineMonsters()">🧬 50%の確率に賭けて配合！</button>
    </div>

    <!-- 手持ちエリア -->
    <div class="box">
        <h3>手持ちの仲間モンスター</h3>
        <ul id="party-list">
            <li>（まだ誰もいません）</li>
        </ul>
    </div>

    <!-- 図鑑エリア -->
    <div class="box">
        <h3>📖 みつけた図鑑</h3>
        <div id="zukan-container" class="zukan-grid"></div>
    </div>

    <script>
        // モンスターのデータ
        const monsterData = {
            "スライム": { avatar: "💧", maxHp: 10 },
            "ドラキー": { avatar: "🦇", maxHp: 12 },
            "ゴースト": { avatar: "👻", maxHp: 15 },
            "おおきづち": { avatar: "🔨", maxHp: 18 },
            "ぐんたいアリ": { avatar: "🐜", maxHp: 8 },
            "キングスライム": { avatar: "👑", maxHp: 30 },
            "ドラゴスライム": { avatar: "🐉", maxHp: 25 },
            "キメラ": { avatar: "🦅", maxHp: 24 },
            "死神きぞく": { avatar: "💀", maxHp: 35 },
            "ヨロコビムシ": { avatar: "🪲", maxHp: 20 },
            "ヘルバトラー": { avatar: "👿", maxHp: 50 },
            "不死鳥ホウオウ": { avatar: "🔥", maxHp: 60 },
            "大魔王 デスタムーア": { avatar: "😈", maxHp: 100 },
            "配合しっぱい": { avatar: "💩", maxHp: 1 }
        };

        const monsterPool = ["スライム", "ドラキー", "ゴースト", "おおきづち", "ぐんたいアリ"];
        let currentEnemy = "スライム";
        let currentEnemyHp = 10;
        
        let myParty = ["スライム", "ドラキー"];
        let discoveredMonsters = JSON.parse(localStorage.getItem('monsterZukan')) || ["スライム", "ドラキー"];

        // 配合大成功レシピ
        const recipe = {
            "スライム+スライム": "キングスライム",
            "スライム+ドラキー": "ドラゴスライム",
            "ドラキー+ゴースト": "キメラ",
            "ゴースト+おおきづち": "死神きぞく",
            "おおきづち+ぐんたいアリ": "ヨロコビムシ",
            "キングスライム+死神きぞく": "ヘルバトラー",
            "キメラ+ドラゴスライム": "不死鳥ホウオウ",
            "ヘルバトラー+不死鳥ホウオウ": "大魔王 デスタムーア"
        };

        // 初期表示
        updateEnemyDisplay();
        updatePartyDisplay();
        updateZukanDisplay();

        // 敵の表示更新
        function updateEnemyDisplay() {
            const maxHp = monsterData[currentEnemy].maxHp;
            document.getElementById("enemy-name").innerText = currentEnemy;
            document.getElementById("enemy-avatar").innerText = monsterData[currentEnemy].avatar;
            document.getElementById("enemy-hp-text").innerText = `HP: ${currentEnemyHp} / ${maxHp}`;
            
            const hpPercent = (currentEnemyHp / maxHp) * 100;
            const bar = document.getElementById("enemy-hp-bar");
            bar.style.width = `${hpPercent}%`;
            
            if (hpPercent <= 30) {
                bar.style.backgroundColor = "#dc3545"; // 赤色
                document.getElementById("catch-button").disabled = false;
            } else {
                bar.style.backgroundColor = "#28a745"; // 緑色
                document.getElementById("catch-button").disabled = true;
            }
            
            // 図鑑に登録
            discover(currentEnemy);
        }

        // 攻撃する
        function attackEnemy() {
            if (currentEnemyHp <= 0) return;
            
            const damage = Math.floor(Math.random() * 3) + 2; // 2~4ダメージ
            currentEnemyHp = Math.max(0, currentEnemyHp - damage);
            
            updateEnemyDisplay();
            
            if (currentEnemyHp === 0) {
                alert("野生のモンスターは 力尽きて逃げてしまった！");
                nextEnemy();
            }
        }

        // 次の敵を出現させる
        function nextEnemy() {
            const randomIndex = Math.floor(Math.random() * monsterPool.length);
            currentEnemy = monsterPool[randomIndex];
            currentEnemyHp = monsterData[currentEnemy].maxHp;
            updateEnemyDisplay();
        }

        // 仲間にする処理
        function catchMonster() {
            myParty.push(currentEnemy);
            discover(currentEnemy);
            updatePartyDisplay();
            alert(currentEnemy + " を仲間にした！");
            nextEnemy();
        }

        // 50%確率の配合システム
        function combineMonsters() {
            const checkboxes = document.querySelectorAll('.select-checkbox:checked');
            
            if (checkboxes.length !== 2) {
                alert("必ず2匹のモンスターを選んでください！");
                return;
            }

            const indices = [];
            checkboxes.forEach(cb => { indices.push(parseInt(cb.value)); });
            
            const m1 = myParty[indices[0]];
            const m2 = myParty[indices[1]];

            // 50%の確率判定
            const isSuccess = Math.random() < 0.5;

            // 親モンスターを手持ちから削除
            indices.sort((a, b) => b - a);
            myParty.splice(indices[0], 1);
            myParty.splice(indices[1], 1);

            if (isSuccess) {
                // 成功：組み合わせレシピを検索
                let pattern1 = `${m1}+${m2}`;
                let pattern2 = `${m2}+${m1}`;
                let baby = recipe[pattern1] || recipe[pattern2] || "キングスライム"; // レシピがなければ王様が生まれる

                alert(`🧬 配合成功！！ (確率50%に当選！)\n\n${m1} ✕ ${m2}\n➔ ${baby} が 生まれた！`);
                myParty.push(baby);
                discover(baby);
            } else {
                // 失敗：💩が生まれる
                alert(`💥 配合しっぱい… (50%の確率でハズレてしまった！)\n\n親の2匹は消え去り、ドロドロのモンスターが生まれた…`);
                myParty.push("配合しっぱい");
                discover("配合しっぱい");
            }

            updatePartyDisplay();
        }

        // 仲間リスト更新
        function updatePartyDisplay() {
            const listElement = document.getElementById("party-list");
            listElement.innerHTML = "";
            
            if (myParty.length === 0) {
                listElement.innerHTML = "<li>（まだ誰もいません）</li>";
                return;
            }
            
            myParty.forEach((monster, index) => {
                const li = document.createElement("li");
                const avatar = monsterData[monster] ? monsterData[monster].avatar : "🥚";
                
                li.innerHTML = `
                    <div class="flex-container">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" class="select-checkbox" value="${index}">
                            <span style="font-weight: bold; margin-left: 10px;">${monster}</span>
                        </label>
                        <span class="list-avatar">${avatar}</span>
                    </div>
                `;
                listElement.appendChild(li);
            });
        }

        // 新しいモンスターを発見したときの図鑑登録
        function discover(name) {
            if (!discoveredMonsters.includes(name)) {
                discoveredMonsters.push(name);
                localStorage.setItem('monsterZukan', JSON.stringify(discoveredMonsters));
                updateZukanDisplay();
            }
        }

        // 図鑑の表示更新
        function updateZukanDisplay() {
            const container = document.getElementById("zukan-container");
            container.innerHTML = "";
            
            Object.keys(monsterData).forEach(key => {
