<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミックスモンスター</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef; padding: 15px; margin: 0; }
        .box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 15px; }
        button { font-size: 15px; padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; width: 85%; max-width: 300px; }
        button:active { background: #0056b3; }
        .haigo-btn { background: #28a745; }
        .haigo-btn:active { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; margin: 8px 0; padding: 12px; border-radius: 5px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .select-checkbox { transform: scale(1.5); margin-right: 15px; }
        
        /* イラスト用のスタイル */
        .monster-img { width: 100px; height: 100px; object-fit: contain; margin: 10px auto; display: block; }
        .list-img { width: 40px; height: 40px; object-fit: contain; margin-left: auto; }
        .flex-container { display: flex; align-items: center; width: 100%; }
    </style>
</head>
<body>

    <h1>👾 ミックスモンスター (イラスト版)</h1>

    <!-- 敵出現エリア -->
    <div class="box">
        <h3>目の前に あらわれた！</h3>
        <h2 id="enemy-name">スライム</h2>
        <!-- モンスターのイラストが表示される場所 -->
        <img id="enemy-img" class="monster-img" src="" alt="モンスター">
        <button onclick="catchMonster()">💥 たたかって仲間にする！</button>
    </div>

    <!-- 配合エリア -->
    <div class="box">
        <h3>🧬 モンスター配合</h3>
        <p style="font-size: 13px; color: #666;">仲間を2匹チェックしてボタンを押そう！</p>
        <button class="haigo-btn" onclick="combineMonsters()">🧬 選んだ2匹を配合する！</button>
    </div>

    <!-- 手持ちエリア -->
    <div class="box">
        <h3>手持ちの仲間モンスター</h3>
        <ul id="party-list">
            <li>（まだ誰もいません）</li>
        </ul>
    </div>

    <script>
        // モンスターのデータ（名前とイラストURL）
        const monsterData = {
            "スライム": { img: "https://blogspot.com" },
            "ドラキー": { img: "https://blogspot.com" },
            "ゴースト": { img: "https://blogspot.com" },
            "おおきづち": { img: "https://blogspot.com" },
            "ぐんたいアリ": { img: "https://blogspot.com" },
            
            // 配合で生まれるモンスター
            "キングスライム": { img: "https://blogspot.com" },
            "ドラゴスライム": { img: "https://blogspot.com" },
            "キメラ": { img: "https://blogspot.com" },
            "死神きぞく": { img: "https://blogspot.com" },
            "ヨロコビムシ": { img: "https://blogspot.com" },
            "謎のタマゴ（強力なモンスター）": { img: "https://blogspot.com" }
        };

        // 野生モンスターの出現プール
        const monsterPool = ["スライム", "ドラキー", "ゴースト", "おおきづち", "ぐんたいアリ"];
        let currentEnemy = "スライム";
        
        // 最初の仲間（テスト用）
        let myParty = ["スライム", "ドラキー"];

        // 配合レシピ
        const recipe = {
            "スライム+スライム": "キングスライム",
            "スライム+ドラキー": "ドラゴスライム",
            "ドラキー+ゴースト": "キメラ",
            "ゴースト+おおきづち": "死神きぞく",
            "おおきづち+ぐんたいアリ": "ヨロコビムシ"
        };

        // 起動時に初期表示
        updateEnemyDisplay();
        updatePartyDisplay();

        // 敵の表示を更新する関数
        function updateEnemyDisplay() {
            document.getElementById("enemy-name").innerText = currentEnemy;
            document.getElementById("enemy-img").src = monsterData[currentEnemy].img;
        }

        // 仲間にする処理
        function catchMonster() {
            myParty.push(currentEnemy);
            updatePartyDisplay();

            alert(currentEnemy + " が 仲間になった！");

            // 次の野生モンスターをランダム決定
            const randomIndex = Math.floor(Math.random() * monsterPool.length);
            currentEnemy = monsterPool[randomIndex];
            updateEnemyDisplay();
        }

        // 配合する処理
        function combineMonsters() {
            const checkboxes = document.querySelectorAll('.select-checkbox:checked');
            
            if (checkboxes.length !== 2) {
                alert("必ず2匹のモンスターを選んでください！");
                return;
            }

            const idx1 = parseInt(checkboxes[0].value);
            const idx2 = parseInt(checkboxes[1].value);
            
            const m1 = myParty[idx1];
            const m2 = myParty[idx2];

            let pattern1 = `${m1}+${m2}`;
            let pattern2 = `${m2}+${m1}`;
            let baby = recipe[pattern1] || recipe[pattern2] || "謎のタマゴ（強力なモンスター）";

            alert(`🧬 配合開始！\n${m1} ✕ ${m2}\n\nおめでとう！\n${baby} が 生まれた！`);

            const targetIndices = [idx1, idx2].sort((a, b) => b - a);
            myParty.splice(targetIndices[0], 1);
            myParty.splice(targetIndices[1], 1);

            myParty.push(baby);
            updatePartyDisplay();
        }

        // 仲間リストの表示を更新
        function updatePartyDisplay() {
            const listElement = document.getElementById("party-list");
            listElement.innerHTML = "";
            
            if (myParty.length === 0) {
                listElement.innerHTML = "<li>（まだ誰もいません）</li>";
                return;
            }
            
            myParty.forEach((monster, index) => {
                const li = document.createElement("li");
                const monsterImgUrl = monsterData[monster] ? monsterData[monster].img : monsterData["謎のタマゴ（強力なモンスター）"].img;
                
                li.innerHTML = `
                    <div class="flex-container">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" class="select-checkbox" value="${index}">
                            <span style="font-weight: bold; margin-left: 10px;">${monster}</span>
                        </label>
                        <img class="list-img" src="${monsterImgUrl}" alt="${monster}">
                    </div>
                `;
                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
