<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミックスモンスター</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef; padding: 15px; margin: 0; }
        .box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 15px; }
        button { font-size: 15px; padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; width: 85%; max-width: 300px; font-weight: bold; }
        button:active { background: #0056b3; }
        .attack-btn { background: #dc3545; }
        .attack-btn:active { background: #bd2130; }
        .catch-btn { background: #ffc107; color: #212529; }
        .catch-btn:disabled { background: #e2e3e5; color: #6c757d; cursor: not-allowed; }
        .haigo-btn { background: #28a745; }
        .haigo-btn:active { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; margin: 8px 0; padding: 12px; border-radius: 5px; border: 1px solid #ddd; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
        .select-checkbox { transform: scale(1.5); margin-right: 15px; }
        .monster-avatar { font-size: 70px; margin: 10px auto; display: block; line-height: 1; }
        .list-avatar { font-size: 35px; margin-left: auto; }
        .flex-container { display: flex; align-items: center; width: 100%; }
        .hp-bar-bg { background: #eee; border-radius: 5px; height: 12px; width: 80%; margin: 5px auto; overflow: hidden; border: 1px solid #ccc; }
        .hp-bar { background: #28a745; height: 100%; width: 100%; transition: width 0.2s; }
        .zukan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; }
        .zukan-item { background: #f8f9fa; border: 1px solid #eee; border-radius: 5px; padding: 5px; font-size: 11px; }
        .status-text { font-size: 12px; color: #555; background: #f8f9fa; padding: 4px 8px; border-radius: 4px; margin-top: 5px; width: 90%; display: inline-block; }
        .select-style { font-size: 16px; padding: 8px; border-radius: 5px; width: 85%; max-width: 300px; margin-bottom: 10px; font-weight: bold; border: 2px solid #007bff; }
        .stage-title { font-size: 20px; font-weight: bold; color: #ff5722; text-shadow: 1px 1px 0 #fff; margin: 0; }
    </style>
</head>
<body>

    <h1>👾 ミックスモンスター (ステージ進行版)</h1>

    <div class="box">
        <div class="stage-title">🧭 <span id="stage-count">ステージ 1</span></div>
        <h3>目の前に あらわれた！</h3>
        <h2 id="enemy-name">スライム</h2>
        <div id="enemy-avatar" class="monster-avatar">💧</div>
        <div id="enemy-hp-text" style="font-weight: bold; font-size: 18px; color: #dc3545; margin: 5px 0;">HP: 10 / 10</div>
        <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar"></div></div>
        <div id="enemy-status" style="font-size: 13px; color: #666; margin-bottom: 15px;"></div>
        <label for="battle-select" style="font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px;">⚔️ たたかう仲間を選ぶ:</label>
        <select id="battle-select" class="select-style"></select>
        <button class="attack-btn" onclick="attackEnemy()">⚔️ こうげきしてHPをへらす！</button>
        <button id="catch-button" class="catch-btn" onclick="catchMonster()" disabled>💥 弱らせて100%仲間にする！</button>
    </div>

    <div class="box">
        <h3>🧬 モンスター配合 (成功率20%)</h3>
        <p style="font-size: 13px; color: #666; font-weight: bold; color: #dc3545;">⚠️失敗すると親モンスターは【完全に消滅】します！</p>
        <button class="haigo-btn" onclick="combineMonsters()">🧬 20%の確率に賭けて配合！</button>
    </div>

    <div class="box">
        <h3>手持ちの仲間モンスター</h3>
        <ul id="party-list">
            <li>（まだ誰もいません）</li>
        </ul>
    </div>

    <div class="box">
        <h3>📖 みつけた図鑑</h3>
        <div id="zukan-container" class="zukan-grid"></div>
    </div>

    <script>
        const baseMonsterData = {
            "スライム": { avatar: "💧", maxHp: 10, atk: 5, def: 3, spd: 6 },
            "ドラキー": { avatar: "🦇", maxHp: 12, atk: 6, def: 4, spd: 8 },
            "ゴースト": { avatar: "👻", maxHp: 15, atk: 7, def: 5, spd: 7 },
            "おおきづち": { avatar: "🔨", maxHp: 18, atk: 10, def: 4, spd: 3 },
            "ぐんたいアリ": { avatar: "🐜", maxHp: 8, atk: 4, def: 2, spd: 5 },
            "キングスライム": { avatar: "👑", maxHp: 30, atk: 15, def: 12, spd: 10 },
            "ドラゴスライム": { avatar: "🐉", maxHp: 25, atk: 18, def: 10, spd: 14 },
            "キメラ": { avatar: "🦅", maxHp: 24, atk: 16, def: 8, spd: 15 },
            "死神きぞく": { avatar: "💀", maxHp: 35, atk: 22, def: 15, spd: 18 },
            "ヨロコビムシ": { avatar: "🪲", maxHp: 20, atk: 12, def: 18, spd: 8 },
            "ヘルバトラー": { avatar: "👿", maxHp: 50, atk: 35, def: 28, spd: 22 },
            "不死鳥ホウオウ": { avatar: "🔥", maxHp: 60, atk: 40, def: 25, spd: 35 },
            "大魔王 デスタムーア": { avatar: "😈", maxHp: 100, atk: 60, def: 50, spd: 40 }
        };

        const monsterPool = ["スライム", "ドラキー", "ゴースト", "おおきづち", "ぐんたいアリ"];
        let currentEnemy = "スライム";
        let currentEnemyHp = 10;
        let currentStage = 1;
        
        let myParty = [
            { name: "スライム", maxHp: 10, atk: 5, def: 3, spd: 6 },
            { name: "ドラキー", maxHp: 12, atk: 6, def: 4, spd: 8 }
        ];
        let discoveredMonsters = JSON.parse(localStorage.getItem('monsterZukan')) || ["スライム", "ドラキー"];

        const recipe = {
            "スライム+スライム": "キングスライム",
            "スライム+ドラキー": "ドラゴスライム",
            "ドラキー+ゴースト": "キメラ",
            "ゴースト+おおきづち": "死神きぞく",
            "おおきづち+ぐんたいアリ": "ヨロコビムシ",
            "キングスライム+死神きぞく": "ヘルバトラー",
            "キメラ+ドラゴスライム": "不死鳥ホウオウ",
            "ヘルバトラー+不死鳥ホウオウ": "大魔王 デスタムーア"
        };

        updateEnemyDisplay();
        updatePartyDisplay();
        updateZukanDisplay();

        function updateEnemyDisplay() {
            const base = baseMonsterData[currentEnemy];
            const stageBonusHp = (currentStage - 1) * 2;
            const stageBonusAtk = Math.floor((currentStage - 1) * 0.5);
            const stageBonusDef = Math.floor((currentStage - 1) * 0.5);

            const calcMaxHp = base.maxHp + stageBonusHp;
            const calcAtk = base.atk + stageBonusAtk;
            const calcDef = base.def + stageBonusDef;

            document.getElementById("stage-count").innerText = `ステージ ${currentStage}`;
            document.getElementById("enemy-name").innerText = currentEnemy;
            document.getElementById("enemy-avatar").innerText = base.avatar;
            document.getElementById("enemy-hp-text").innerText = `HP: ${currentEnemyHp} / ${calcMaxHp}`;
            document.getElementById("enemy-status").innerText = `⚔️攻撃:${calcAtk}  🛡️守備:${calcDef}  💨素早さ:${base.spd}`;
            
            const hpPercent = (currentEnemyHp / calcMaxHp) * 100;
            const bar = document.getElementById("enemy-hp-bar");
            bar.style.width = `${hpPercent}%`;
            
            if (hpPercent <= 50) {
                bar.style.backgroundColor = "#dc3545"; 
                document.getElementById("catch-button").disabled = false;
            } else {
                bar.style.backgroundColor = "#28a745"; 
                document.getElementById("catch-button").disabled = true;
            }
            discover(currentEnemy);
        }

        function attackEnemy() {
            if (currentEnemyHp <= 0) return;
            if (myParty.length === 0) {
                alert("たたかえる仲間がいません！");
                return;
            }
            const selectElement = document.getElementById("battle-select");
            const myIndex = parseInt(selectElement.value);
            const myFighter = myParty[myIndex];
            const stageBonusDef = Math.floor((currentStage - 1) * 0.5);
            const enemyDef = baseMonsterData[currentEnemy].def + stageBonusDef;
            
            let damage = Math.floor(myFighter.atk - (enemyDef / 2)) + Math.floor(Math.random() * 3);
            if (damage < 2) damage = 2;

            currentEnemyHp = Math.max(0, currentEnemyHp - damage);
            updateEnemyDisplay();
            alert(`${myFighter.name} の こうげき！\n${currentEnemy} に ${damage} の ダメージ！`);
            
            if (currentEnemyHp === 0) {
                alert(`野生の ${currentEnemy} をたおした！\n次のステージへ進みます！`);
                currentStage++;
                nextEnemy();
            }
        }

        function nextEnemy() {
            const randomIndex = Math.floor(Math.random() * monsterPool.length);
            currentEnemy = monsterPool[randomIndex];
            const stageBonusHp = (currentStage - 1) * 2;
            currentEnemyHp = baseMonsterData[currentEnemy].maxHp + stageBonusHp;
            updateEnemyDisplay();
        }

        function createCaughtMonster(name) {
            const base = baseMonsterData[name];
            const rand = () => Math.floor(Math.random() * 3) - 1;
            return {
                name: name,
                maxHp: base.maxHp + rand(),
                atk: base.atk + rand(),
                def: base.def + rand(),
                spd: base.spd + rand()
            };
        }

        function catchMonster() {
            const newMonster = createCaughtMonster(currentEnemy);
            myParty.push(newMonster);
            discover(currentEnemy);
            updatePartyDisplay();
            alert(`💥 成功！\n\n${currentEnemy} が確実に仲間になった！\n次のステージへ進みます！`);
            currentStage++;
            nextEnemy();
        }

        function combineMonsters() {
            const checkboxes = document.querySelectorAll('.select-checkbox:checked');
            if (checkboxes.length !== 2) {
                alert("必ず2匹のモンスターを選んでください！");
                return;
            }
            const indices = [];
